name: Test Tool Guide Automation

on:
  push:
    branches:
      - tools-guide
  workflow_dispatch:

jobs:
  run-tool-guide:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq docxtpl

      - name: Debug repository structure
        run: |
          pwd
          ls
          ls "Guide for different testing tools"
          ls "Guide for different testing tools/Tool Guide Automation tool"

      - name: Check GROQ_API_KEY secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "GROQ_API_KEY length: ${#GROQ_API_KEY}"

      - name: Run Tool Guide Automation tool
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOOL_NAME: "Test_Tool"
        run: python "Guide for different testing tools/Tool Guide Automation tool/toolguide.py"
