name: Test Tool Guide Automation

on:
  push:
    branches:
      - tools-guide
  workflow_dispatch:

jobs:
  run-tool-guide:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq docxtpl

      - name: Run Tool Guide Automation tool
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python "Guide for different testing tools/Tool Guide Automation tool/main.py"
